name: Build APK

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install system dependencies
        run: |
            sudo apt-get update
            sudo apt-get install -y \
            build-essential git ffmpeg \
            libsdl2-dev libsdl2-image-dev libsdl2-mixer-dev \
            libsdl2-ttf-dev libportmidi-dev libswscale-dev \
            libavformat-dev libavcodec-dev zlib1g-dev \
            openjdk-17-jdk unzip zip \
            autoconf automake libtool libltdl-dev \
            pkg-config cmake m4

      - name: Install Python deps
        run: |
            pip install "cython<3.0" buildozer

      - name: Fix libtool macros
        run: |
            sudo apt-get install -y libltdl-dev

      - name: Install build deps
        run: |
            sudo apt-get update
            sudo apt-get install -y autoconf automake libtool pkg-config m4 libltdl-dev
    
      - name: Build APK
        run: |
          buildozer android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: underwaterclicker-apk
          path: bin/*.apk
